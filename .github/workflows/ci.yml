name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint, unit tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build

  storybook:
    name: Storybook accessibility tests
    runs-on: ubuntu-24.04
    # Playwright's ready-made setup, with the browsers and the system libraries they need already
    # installed. Installing them on each run downloads from Ubuntu's servers, which can take an hour.
    # The version must match playwright in package.json. --ipc=host gives Chrome the machine's
    # shared memory, as the container's own is too small and Chrome crashes without it
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:storybook
      - run: pnpm build-storybook
